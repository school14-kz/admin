<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Квиз: Экономия энергии</title>
    <!-- Подключение Tailwind CSS для современного и адаптивного дизайна -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключение шрифта Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Библиотека для яркой анимации конфетти -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Анимация встряски при неправильном ответе */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }

        .animate-shake {
            animation: shake 0.45s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* Анимация плавного появления элементов */
        @keyframes fadeInScale {
            from {
                opacity: 0;
                transform: translateY(10px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .animate-fade-in {
            animation: fadeInScale 0.35s ease-out forwards;
        }

        /* Стилизация кнопок вариантов ответа */
        .option-btn {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .option-btn:not(:disabled):hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px -3px rgba(16, 185, 129, 0.15);
        }

        .option-btn:not(:disabled):active {
            transform: translateY(0);
        }

        /* Красная вспышка по краям экрана при ошибке */
        @keyframes errorPulse {
            0% { box-shadow: inset 0 0 0 0 rgba(239, 68, 68, 0); }
            30% { box-shadow: inset 0 0 40px 10px rgba(239, 68, 68, 0.25); }
            100% { box-shadow: inset 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .error-flash {
            animation: errorPulse 0.6s ease-out;
        }
    </style>
</head>
<body id="body-container" class="flex items-center justify-center p-4 sm:p-6 text-slate-800">

    <!-- Главный контейнер приложения -->
    <main class="w-full max-w-2xl bg-white/95 backdrop-blur-md rounded-3xl shadow-xl border border-white/60 overflow-hidden transition-all duration-300">
        
        <!-- Верхняя шапка с прогрессом и счётом -->
        <header id="quiz-header" class="px-6 pt-6 pb-4 border-b border-slate-100">

                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">

    <script>

                correct: 2,

                    "Сжигание мазута"
                ],
                correct: 0,
                explanation: "Солнце и ветер — возобновляемые источники энергии, которые не истощаются и не загрязняют атмосферу выбросами."
            },
            {
                question: "Что помогает лучше всего сохранять тепло в доме зимой без лишних затрат?",
                options: [
                    "Плотно закрытые длинными шторами батареи отопления",

                ],
                correct: 1,
                explanation: "Через щели в окнах и дверях уходит до 30–40% тепла, а открытые батареи свободно отдают тепло в комнату."

        // Буквенные обозначения вариантов
        const optionLetters = ['а', 'б', 'в'];

        // Состояние квиза
        let currentQuestionIndex = 0;
        let score = 0;
        let answered = false;

        // Элементы DOM
        const bodyContainer = document.getElementById('body-container');
        const quizHeader = document.getElementById('quiz-header');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');

        const currentQNumEl = document.getElementById('current-q-num');
        const scoreCountEl = document.getElementById('score-count');
        const progressBarEl = document.getElementById('progress-bar');

        const questionContainer = document.getElementById('question-container');
        const questionTextEl = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');

        const feedbackBox = document.getElementById('feedback-box');
        const feedbackIcon = document.getElementById('feedback-icon');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackExplanation = document.getElementById('feedback-explanation');

        const nextBtnContainer = document.getElementById('next-btn-container');
        const nextBtn = document.getElementById('next-btn');
        const nextBtnText = document.getElementById('next-btn-text');

        const restartBtn = document.getElementById('restart-btn');

        /**
         * Запуск анимации конфетти при правильном ответе
         */
        function triggerSuccessConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 75,
                    spread: 70,
                    origin: { y: 0.65 },
                    colors: ['#10b981', '#34d399', '#38bdf8', '#fbbf24', '#a78bfa']
                });
            }
        }

        /**
         * Запуск праздничного салюта конфетти на финальном экране
         */
        function triggerFinalConfetti() {
            if (typeof confetti !== 'function') return;
            const duration = 2000;
            const end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#10b981', '#0ea5e9', '#f59e0b']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#10b981', '#0ea5e9', '#f59e0b']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        /**
         * Отрисовка текущего вопроса и вариантов ответа
         */
        function renderQuestion() {
            answered = false;
            const qData = quizQuestions[currentQuestionIndex];

            // Обновление шапки и прогресс-бара
            currentQNumEl.textContent = currentQuestionIndex + 1;
            scoreCountEl.textContent = score;
            const progressPercent = ((currentQuestionIndex + 1) / quizQuestions.length) * 100;
            progressBarEl.style.width = `${progressPercent}%`;

            // Перезапуск анимации вопроса
            questionContainer.classList.remove('animate-fade-in');
            void questionContainer.offsetWidth; // trigger reflow
            questionContainer.classList.add('animate-fade-in');

            questionTextEl.textContent = `${currentQuestionIndex + 1}. ${qData.question}`;

            // Скрываем фидбек и кнопку "Далее"
            feedbackBox.classList.add('hidden');
            nextBtnContainer.classList.add('hidden');

            // Очищаем и создаём кнопки вариантов ответа (а, б, в)
            optionsContainer.innerHTML = '';
            qData.options.forEach((optionText, index) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'option-btn w-full text-left p-4 sm:p-4.5 rounded-2xl border-2 border-slate-200 bg-white hover:border-emerald-400 hover:bg-emerald-50/40 flex items-center gap-3.5 cursor-pointer group';
                btn.dataset.index = index;

                btn.innerHTML = `
                    <span class="option-letter flex-shrink-0 w-9 h-9 rounded-xl bg-slate-100 group-hover:bg-emerald-100 group-hover:text-emerald-700 text-slate-700 font-bold text-base flex items-center justify-center uppercase transition-colors">
                        ${optionLetters[index]}
                    </span>
                    <span class="option-label text-slate-800 font-medium text-base sm:text-lg leading-snug flex-1">
                        ${optionText}
                    </span>
                    <span class="option-status text-xl opacity-0 transition-opacity"></span>
                `;

                btn.addEventListener('click', () => handleAnswer(index, btn));
                optionsContainer.appendChild(btn);
            });
        }

        /**
         * Обработка выбора ответа пользователем
         */
        function handleAnswer(selectedIndex, selectedBtn) {
            if (answered) return;
            answered = true;

            const qData = quizQuestions[currentQuestionIndex];
            const isCorrect = selectedIndex === qData.correct;
            const allButtons = optionsContainer.querySelectorAll('.option-btn');

            // Блокируем все кнопки после выбора
            allButtons.forEach((btn, idx) => {
                btn.disabled = true;
                btn.classList.remove('hover:border-emerald-400', 'hover:bg-emerald-50/40', 'cursor-pointer');
                btn.classList.add('cursor-default');

                const letterBadge = btn.querySelector('.option-letter');
                const statusIcon = btn.querySelector('.option-status');

                // Подсвечиваем правильный ответ зелёным в любом случае
                if (idx === qData.correct) {
                    btn.classList.remove('border-slate-200', 'bg-white');
                    btn.classList.add('border-emerald-500', 'bg-emerald-50', 'ring-2', 'ring-emerald-500/20');
                    letterBadge.classList.remove('bg-slate-100', 'text-slate-700');
                    letterBadge.classList.add('bg-emerald-500', 'text-white');
                    statusIcon.textContent = '✅';
                    statusIcon.classList.remove('opacity-0');
                }
            });

            if (isCorrect) {
                // Сценарий правильного ответа
                score++;
                scoreCountEl.textContent = score;

                feedbackBox.className = 'mt-6 p-4 sm:p-5 rounded-2xl border border-emerald-200 bg-emerald-50/90 text-emerald-950 animate-fade-in';
                feedbackIcon.textContent = '🎉';
                feedbackTitle.textContent = 'Правильно! Отличная работа!';
                feedbackTitle.className = 'font-bold text-base sm:text-lg text-emerald-800';
                feedbackExplanation.textContent = qData.explanation;

                triggerSuccessConfetti();
            } else {
                // Сценарий неправильного ответа
                const selectedLetter = selectedBtn.querySelector('.option-letter');
                const selectedStatus = selectedBtn.querySelector('.option-status');

                selectedBtn.classList.remove('border-slate-200', 'bg-white');
                selectedBtn.classList.add('border-rose-500', 'bg-rose-50', 'animate-shake');
                selectedLetter.classList.remove('bg-slate-100', 'text-slate-700');
                selectedLetter.classList.add('bg-rose-500', 'text-white');
                selectedStatus.textContent = '❌';
                selectedStatus.classList.remove('opacity-0');

                // Лёгкая красная вспышка по краям экрана вместо конфетти
                bodyContainer.classList.remove('error-flash');
                void bodyContainer.offsetWidth;
                bodyContainer.classList.add('error-flash');

                feedbackBox.className = 'mt-6 p-4 sm:p-5 rounded-2xl border border-rose-200 bg-rose-50/90 text-rose-950 animate-fade-in';
                feedbackIcon.textContent = '💡';
                feedbackTitle.textContent = 'Неправильно! Запомним на будущее:';
                feedbackTitle.className = 'font-bold text-base sm:text-lg text-rose-800';
                feedbackExplanation.textContent = qData.explanation;
            }

            // Показываем блок объяснения и кнопку перехода
            feedbackBox.classList.remove('hidden');

            if (currentQuestionIndex === quizQuestions.length - 1) {
                nextBtnText.textContent = 'Показать результат';
            } else {
                nextBtnText.textContent = 'Следующий вопрос';
            }
            nextBtnContainer.classList.remove('hidden');
        }

        /**
         * Переход к следующему вопросу или показ итогового экрана
         */
        nextBtn.addEventListener('click', () => {
            if (currentQuestionIndex < quizQuestions.length - 1) {
                currentQuestionIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        });

        /**
         * Отображение финального экрана результатов
         */
        function showResults() {
            quizHeader.classList.add('hidden');
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            const percent = Math.round((score / quizQuestions.length) * 100);
            document.getElementById('final-score').textContent = score;
            document.getElementById('final-percent').textContent = percent;

            const resultEmoji = document.getElementById('result-emoji');
            const resultBadge = document.getElementById('result-badge');
            const resultMessage = document.getElementById('result-message');

            if (score >= 17) {
                resultEmoji.textContent = '🏆';
                resultBadge.textContent = 'Мастер энергосбережения';
                resultBadge.className = 'inline-block px-4 py-1.5 rounded-full text-sm font-bold bg-emerald-100 text-emerald-800 mb-3';
                resultMessage.textContent = 'Блестящий результат! Вы настоящий эко-эксперт и знаете все секреты экономии электроэнергии и тепла.';
                triggerFinalConfetti();
            } else if (score >= 12) {
                resultEmoji.textContent = '🌟';
                resultBadge.textContent = 'Продвинутый знаток';
                resultBadge.className = 'inline-block px-4 py-1.5 rounded-full text-sm font-bold bg-sky-100 text-sky-800 mb-3';
                resultMessage.textContent = 'Очень хороший результат! Вы отлично разбираетесь в полезных привычках, а пару мелочей теперь точно запомните.';
                triggerSuccessConfetti();
            } else {
                resultEmoji.textContent = '🌱';
                resultBadge.textContent = 'Начинающий эко-герой';
                resultBadge.className = 'inline-block px-4 py-1.5 rounded-full text-sm font-bold bg-amber-100 text-amber-800 mb-3';
                resultMessage.textContent = 'Хорошее начало! Теперь вы знаете много полезных лайфхаков, как беречь энергию дома и в школе. Попробуйте пройти ещё раз!';
            }
        }

        /**
         * Перезапуск квиза сначала
         */
        restartBtn.addEventListener('click', () => {
            currentQuestionIndex = 0;
            score = 0;
            resultScreen.classList.add('hidden');
            quizHeader.classList.remove('hidden');
            quizScreen.classList.remove('hidden');
            renderQuestion();
        });

        // Инициализация первого вопроса при загрузке страницы
        window.addEventListener('DOMContentLoaded', renderQuestion);
    </script>
</body>
</html>
